# A tag that matches manifest.json's version builds the plugin and attaches the three files the
# Obsidian directory installs from. The release is a draft, so its notes are written by a person.
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The tag is the manifest's version
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      # A release published by hand creates its tag, and this runs for it: the files are replaced
      # with the ones just built rather than a second release attempted.
      - name: Draft the release, or refresh its files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "$GITHUB_REF_NAME"
          fi
